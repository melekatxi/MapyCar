name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (requiere Docker para Postgres/Vault vía testcontainers)
        run: pytest -q

      - name: Escaneo de dependencias (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --strict --skip-editable

  build-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen backend
        run: docker build -t sofia-backend:ci ./backend

      - name: Escaneo de imagen (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: sofia-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  frontend-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm run test

      - name: Build (tsc + vite)
        run: npm run build

  frontend-build-image:
    runs-on: ubuntu-latest
    needs: frontend-lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen frontend
        run: docker build -t sofia-frontend:ci ./frontend

      - name: Escaneo de imagen (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: sofia-frontend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

