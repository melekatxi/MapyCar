[project]
name = "sofia-backend"
version = "0.1.0"
description = "API y workers de la app de rutas de visitas a pacientes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "httpx>=0.27",
    "cryptography>=43.0",
    "geoalchemy2>=0.15",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "hvac>=2.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "fakeredis>=2.24",
    "testcontainers[postgres,redis]>=4.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: Depends(...) en valores por defecto es el patrón idiomático de FastAPI.
ignore = ["B008"]
